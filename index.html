<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Image Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Clipboard Image Editor</h1>
            <div class="toolbar">
                <button id="loadBtn">クリップボードから読み込み</button>
                <button id="saveBtn" disabled>クリップボードに保存</button>
            </div>
        </header>

        <main>
            <!-- 操作パネル（上部ツールバー） -->
            <div class="toolbar-panel">
                <div class="tb-group">
                    <span class="tb-caption">ツール</span>
                    <div class="tb-seg">
                        <button id="selectModeBtn" class="tool-btn active" title="選択">↖ 選択</button>
                        <button id="textModeBtn" class="tool-btn" title="テキスト">T テキスト</button>
                        <button id="rectModeBtn" class="tool-btn" title="矩形">▭ 矩形</button>
                        <button id="circleModeBtn" class="tool-btn" title="円">◯ 円</button>
                        <button id="lineModeBtn" class="tool-btn" title="線">╱ 線</button>
                    </div>
                </div>

                <!-- 描画・選択中オブジェクトに関係する設定だけ表示 -->
                <div class="tb-group" id="fgGroup" hidden>
                    <span class="tb-caption">色</span>
                    <div class="color-palette" id="mainColorPalette">
                        <button class="color-btn active" data-color="#ff0000" style="background-color: #ff0000;" title="赤"></button>
                        <button class="color-btn" data-color="#0000ff" style="background-color: #0000ff;" title="青"></button>
                        <button class="color-btn" data-color="#ffff00" style="background-color: #ffff00;" title="黄"></button>
                        <button class="color-btn" data-color="#00ff00" style="background-color: #00ff00;" title="緑"></button>
                        <button class="color-btn" data-color="#ffa500" style="background-color: #ffa500;" title="オレンジ"></button>
                        <button class="color-btn" data-color="#800080" style="background-color: #800080;" title="紫"></button>
                        <button class="color-btn" data-color="#000000" style="background-color: #000000;" title="黒"></button>
                        <button class="color-btn" data-color="#ffffff" style="background-color: #ffffff;" title="白"></button>
                    </div>
                </div>

                <div class="tb-group" id="fillGroup" hidden>
                    <span class="tb-caption">塗り</span>
                    <div class="color-palette" id="fillColorPalette">
                        <button class="color-btn fill-color active" data-color="transparent" title="なし" style="background: linear-gradient(to bottom right, #fff 45%, #f00 45%, #f00 55%, #fff 55%);"></button>
                        <button class="color-btn fill-color" data-color="#ff0000" style="background-color: #ff0000;" title="赤"></button>
                        <button class="color-btn fill-color" data-color="#0000ff" style="background-color: #0000ff;" title="青"></button>
                        <button class="color-btn fill-color" data-color="#ffff00" style="background-color: #ffff00;" title="黄"></button>
                        <button class="color-btn fill-color" data-color="#ffffff" style="background-color: #ffffff;" title="白"></button>
                        <button class="color-btn fill-color" data-color="#000000" style="background-color: #000000;" title="黒"></button>
                    </div>
                </div>

                <div class="tb-group" id="widthGroup" hidden>
                    <span class="tb-caption">線幅</span>
                    <input type="number" id="lineWidthInput" value="2" min="1" max="20" class="tb-input">
                </div>

                <div class="tb-group" id="selectionGroup" hidden>
                    <span class="tb-caption">選択中</span>
                    <button id="bringToFrontBtn" class="tb-btn" disabled>前面へ</button>
                    <button id="sendToBackBtn" class="tb-btn" disabled>背面へ</button>
                    <button id="deleteSelectedBtn" class="tb-btn danger" disabled>削除</button>
                </div>

                <div class="tb-group">
                    <span class="tb-caption">表示</span>
                    <button id="zoomOutBtn" class="tb-btn icon">−</button>
                    <span id="zoomDisplay" class="zoom-value">100%</span>
                    <button id="zoomInBtn" class="tb-btn icon">+</button>
                    <button id="fitToScreenBtn" class="tb-btn">画面に合わせる</button>
                    <button id="actualSizeBtn" class="tb-btn">等倍</button>
                </div>

                <div class="tb-group">
                    <span class="tb-caption">画像</span>
                    <button id="rotateLeftBtn" class="tb-btn" title="左に90°回転">↺</button>
                    <button id="rotateRightBtn" class="tb-btn" title="右に90°回転">↻</button>
                    <button id="cropBtn" class="tb-btn">✂ トリミング</button>
                    <button id="resetCropBtn" class="tb-btn">選択解除</button>
                    <button id="resetBtn" class="tb-btn danger">リセット</button>
                </div>

                <div class="tb-group">
                    <span class="tb-caption">リサイズ</span>
                    <label class="tb-label">幅 <input type="number" id="widthInput" min="1" class="tb-input"></label>
                    <label class="tb-label">高さ <input type="number" id="heightInput" min="1" class="tb-input"></label>
                    <label class="tb-label checkbox-label">
                        <input type="checkbox" id="autoResizeCheck">
                        自動
                    </label>
                    <button id="resizeBtn" class="tb-btn">適用</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="canvas"></canvas>
                <input type="text" id="inlineTextEditor" class="inline-text-editor" style="display: none;">
            </div>
        </main>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
